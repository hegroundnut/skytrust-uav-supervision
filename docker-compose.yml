# docker-compose.yml —— 本部署对 docker 的使用范围有限，此文件刻意**不编排三链**。
#
# 实际在跑的 docker 容器（部署机现状）：
#   1. Fabric 运营链网络：peer0.org1/org2 + orderer + dev-peer 链码容器，由子模块内
#      compose 启动（platforms/fabric-samples/test-network/compose/compose-test-net.yaml
#      + docker/docker-compose-test-net.yaml，官方镜像），不在此重复声明；
#      bin/ 下静态构建的 peer/cryptogen/configtxgen 仅作 CLI 客户端使用。
#   2. ChainMaker 合约 VM：VM-GO-wx-org-chain1（chainmaker-vm-engine:v2.3.9），
#      由 /opt/chains 的节点进程自动拉起，与 compose 无关。
#   3. cm_db（MySQL 5.7）：gchain 管理平台数据库，部署时手工 docker run 启动；
#      本文件如实登记其规格，供新机器复现（见文末步骤）。
#
# 红线：ChainMaker / FISCO BCOS 节点与 skytrust-backend 以原生进程运行，
# 由 scripts/*.sh 编排（官方 release 二进制 + /opt 下证书与账本）。**不要把它们
# 容器化进本文件**——任何 compose down/重建都可能触碰账本（同 network.sh down 禁令）。
# cm_db 数据是区块浏览器同步缓存，可从链上重拉；卷声明为 external，
# `docker compose down -v` 也不会删除它。
#
# gchain-back 自带的 docker-compose.yml（官方 management v2.4.0 镜像 + mysql 8.0.29）
# 被刻意弃用：本平台从源码构建、MySQL 用 5.7（偏差 D14/D19，见 docs/version-matrix.md）。
#
# 新机器复现 cm_db（密码经环境变量注入，绝不写入本文件/Git —— 指南 §5-④）：
#   docker volume create cm_db_data
#   CM_DB_ROOT_PASSWORD=<密码> CM_DB_PASSWORD=<密码> docker compose up -d cm_db
# 部署机上 cm_db 已在运行（无 compose 标签），不要再 `up`，否则端口 3306 冲突。

services:
  cm_db:
    image: mysql:5.7
    restart: unless-stopped
    ports:
      - "127.0.0.1:3306:3306"        # 仅回环监听，不对公网暴露
    volumes:
      - cm_db_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${CM_DB_ROOT_PASSWORD:?经环境变量注入，绝不提交}
      MYSQL_USER: chainmaker
      MYSQL_PASSWORD: ${CM_DB_PASSWORD:?经环境变量注入，绝不提交}
      MYSQL_DATABASE: chainmaker_dev
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_allowed_packet=200M
      - --innodb-buffer-pool-size=64M   # 低内存部署机调优（实测参数）
      - --performance-schema=OFF

volumes:
  cm_db_data:
    external: true   # 复用既有卷；compose down -v 不会删除 external 卷
